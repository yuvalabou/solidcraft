[package]
name = "nestcraft"
description = "NestCraft 3D nesting desktop app and headless MCP host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "nestcraft"

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "clipboard"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }
nestcraft-core = { path = "../../crates/nestcraft-core" }
rfd = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
solidcraft-look = { workspace = true }
solidcraft-theme = { workspace = true }
solidcraft-ui-kit = { workspace = true }
solidcraft-viewport = { workspace = true }
solidcraft-viewport-egui = { workspace = true }
solidcraft-viewport-gpu = { workspace = true }
sysinfo = { workspace = true }
wgpu = { workspace = true }

[lints]
workspace = true
